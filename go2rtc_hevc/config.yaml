name: go2rtc H.265
description: go2rtc built from source with more robust H.265 reception over WebRTC. Runs next to the official add-on.
version: 1.9.15-hevc.4
slug: go2rtc_hevc
url: https://github.com/niborb/ha-go2rtc-hevc
arch:
  - amd64
  - aarch64
init: false
boot: manual
startup: application
host_network: true
options:
  api_port: 1985
  api_username: go2rtc
  api_password: ""
  h265_only: true
  key_wait_ms: 1000
  reorder_wait_ms: 100
  keyframe_request_ms: 2000
  streams: []
schema:
  api_port: port
  api_username: str
  api_password: password
  h265_only: bool
  key_wait_ms: int
  reorder_wait_ms: int
  keyframe_request_ms: int
  streams:
    - name: str
      url: password
